# example netlify.toml
[build]
  command = "pnpm --filter vue3-resize-bounding... run build && pnpm --filter vue3-resize-bounding... run docs:build"
  functions = "netlify/functions"
  publish = "packages/vue/vue3-resize-bounding/storybook-static"

  [[redirects]]
    from = "/*"
    status = 200

  [[headers]]
    for = "/*"
    [headers.values]
      Strict-Transport-Security = "max-age=63072000; includeSubDomains; preload"
